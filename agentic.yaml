root_agent: router_agent

models:
  gemini_pro:
    provider: gemini
    model_id: gemini-2.0-flash
  gemma4_26b:
    provider: gemini
    model_id: gemma-4-26b-a4b-it

tools:
  cms_entity_list:
    type: builtin
    description: List CMS entities
    parameters:
      name:
        type: string
        description: Name of the entity schema
        required: true
      limit:
        type: string
        description: Number of records to return
        required: false

  cms_entity_get:
    type: builtin
    description: Get a CMS entity record by ID
    parameters:
      name:
        type: string
        description: Name of the entity schema
        required: true
      id:
        type: string
        description: ID of the record
        required: true

  cms_entity_create:
    type: builtin
    description: Create a CMS entity record
    parameters:
      name:
        type: string
        description: Name of the entity schema
        required: true
      data:
        type: object
        description: Record data
        required: true

  cms_schema_list:
    type: builtin
    description: List all schemas
    parameters: {}

  cms_bizdef_list:
    type: builtin
    description: List all available CMS BizDefs and their descriptions.
    parameters: {}

  cms_bizdef_get:
    type: builtin
    description: Get the detailed definition and context for a specific CMS BizDef, including roles and entity descriptions.
    parameters:
      name:
        type: string
        description: Name of the BizDef
        required: true

  cms_bizdef_evolve:
    type: builtin
    description: Trigger a background schema evolution for all records of a specific entity. Use this when a schema has changed and you need to modernize old data.
    parameters:
      entity:
        type: string
        description: Name of the entity to evolve
        required: true
      batch_size:
        type: number
        description: Number of records to process in each batch (default 100)
        required: false

  cms_a2ui_update:
    type: builtin
    description: Update a component in the A2UI dashboard
    parameters:
      id:
        type: string
        description: Component ID
        required: true
      type:
        type: string
        description: Component type (e.g., Card, DataTable, Heading)
        required: true
      attributes:
        type: object
        description: Component attributes
        required: false
      children:
        type: array
        description: List of child component IDs
        required: false

agents:
  router_agent:
    type: router
    description: Routes requests between CMS and UI sub-agents
    sub_agents:
      - cms_agent
      - ui_agent
    classifier:
      model: gemma4_26b
      prompt: |
        Classify the user's intent to one of the following BizDefs: ${options}.
        User message: "${userInput}"
        Output ONLY the BizDef name.
      fallback_message: "I'm not sure which BizDef you want to use. Please select from the options provided."
    selection_prompt: |
      I'm not sure which assistant to use. Please select one:
      ${options}

  cms_agent:
    type: llm
    description: Manages CMS data (entities, schemas)
    model: gemini_pro
    instruction: |
      You are the CMS data assistant. You can query, create, update, and list CMS data using the provided tools.
      Always retrieve data when asked by the user.
    tools:
      - cms_entity_list
      - cms_entity_get
      - cms_entity_create
      - cms_schema_list
      - cms_bizdef_list
      - cms_bizdef_get
      - cms_bizdef_evolve

  ui_agent:
    type: llm
    description: Manages the A2UI dashboard
    model: gemini_pro
    instruction: |
      You are the UI assistant. You can modify the active dashboard components using A2UI.
      When asked to show data on the screen, update the necessary A2UI components using the cms_a2ui_update tool.
    tools:
      - cms_a2ui_update
